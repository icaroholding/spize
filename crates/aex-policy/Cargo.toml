[package]
name = "aex-policy"
description = "Policy engine for Agent Exchange Protocol (AEX): pluggable (DefaultPolicy, TierPolicy, Cedar planned)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aex-core = { path = "../aex-core", version = "=2.0.0-beta.1" }
aex-net = { path = "../aex-net", version = "=2.0.0-beta.1" }
aex-scanner = { path = "../aex-scanner", version = "=2.0.0-beta.1" }

async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros"] }
