name: Publish crates

# Auto-publish on tag push (v*) and manual replay via the GitHub UI /
# `gh workflow run`. Manual replay accepts a `tag` input so a stuck
# release can be re-published from any commit without cutting a new
# tag — same pattern as publish-npm.yml / publish-pypi.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.0.0-beta.1). Defaults to the workflow ref.'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$tag"
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - name: Publish in topological order
        # Crate order is the topological sort over the internal
        # `path = "../*"` dependency graph: each line MUST appear
        # after every aex-* crate it depends on. Adding a new
        # internal crate without inserting it here in the right
        # position is the failure mode that left v1.x partially
        # published — the loop happily skipped missing crates with
        # `|| true` and the workflow ended green.
        #
        # Topological dependency notes (one entry per crate):
        #   aex-core            — no aex-* deps
        #   aex-net             — no aex-* deps (workspace crypto deps only)
        #   aex-jws             — no aex-* deps (workspace crypto deps only)
        #   aex-audit           — aex-core
        #   aex-scanner         — aex-core
        #   aex-identity        — aex-core, aex-jws, aex-net
        #   aex-policy          — aex-core, aex-net, aex-scanner
        #   aex-tunnel          — aex-identity
        #   aex-billing         — aex-policy
        #   aex-a2a-bridge      — aex-core, aex-jws
        #   aex-conformance     — aex-core, aex-identity, aex-jws, aex-net
        #   aex-data-plane      — aex-core, aex-scanner, aex-audit,
        #                          aex-tunnel, aex-net
        #   aex-control-plane   — aex-core, aex-audit, aex-scanner,
        #                          aex-policy, aex-net
        #   aex-cli             — aex-core, aex-identity
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          failed_real=()
          skipped_already_published=()
          published=()

          CRATES=(
            aex-core
            aex-net
            aex-jws
            aex-audit
            aex-scanner
            aex-identity
            aex-policy
            aex-tunnel
            aex-billing
            aex-a2a-bridge
            aex-conformance
            aex-data-plane
            aex-control-plane
            aex-cli
          )

          # `set -o pipefail` is the only safe way to surface the
          # exit status of `cargo publish` when piped through `tee`.
          # Without it, the `if` checks tee's exit code (always 0)
          # and every failure gets misreported as success — that is
          # what happened on the v2.0.0-beta.1 publish where
          # aex-tunnel silently failed verify-manifest yet was
          # accounted as "newly published".
          set -o pipefail

          for crate in "${CRATES[@]}"; do
            echo "::group::Publish $crate"
            log_file="/tmp/${crate}.publish.log"
            # Up to 3 attempts per crate: crates.io index sometimes
            # takes longer than 30 s to surface a brand-new version
            # to subsequent dependents. We retry only on
            # "failed to select a version for the requirement" /
            # "not found in registry" symptoms; real errors (manifest
            # syntax, build failure, auth) fail immediately.
            attempts=0
            outcome=""
            while [ $attempts -lt 3 ]; do
              attempts=$((attempts + 1))
              if (cd "crates/$crate" && cargo publish \
                  --token "$CARGO_REGISTRY_TOKEN" \
                  --allow-dirty) 2>&1 | tee "$log_file"; then
                outcome="published"
                break
              fi
              if grep -qE "already (uploaded|exists)" "$log_file"; then
                outcome="already"
                break
              fi
              if grep -qE "failed to select a version for the requirement|not found in registry|no matching package" "$log_file"; then
                if [ $attempts -lt 3 ]; then
                  echo "::warning::index lag detected, retrying $crate after 60 s (attempt $attempts/3)"
                  sleep 60
                  continue
                fi
              fi
              outcome="failed"
              break
            done

            case "$outcome" in
              published)
                published+=("$crate")
                sleep 30
                ;;
              already)
                skipped_already_published+=("$crate")
                echo "Already on crates.io; skipping."
                ;;
              failed)
                failed_real+=("$crate")
                echo "::error::publish failed for $crate (not already-published)"
                tail -30 "$log_file"
                ;;
            esac
            echo "::endgroup::"
          done

          echo ""
          echo "──────────────────────────────────────────"
          echo "Publish summary"
          echo "──────────────────────────────────────────"
          echo "Newly published      (${#published[@]}): ${published[*]:-none}"
          echo "Already on crates.io (${#skipped_already_published[@]}): ${skipped_already_published[*]:-none}"
          echo "Real failures        (${#failed_real[@]}): ${failed_real[*]:-none}"

          if [ ${#failed_real[@]} -gt 0 ]; then
            echo "::error::${#failed_real[@]} crate(s) failed for non-benign reasons."
            exit 1
          fi
